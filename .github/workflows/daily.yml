name: Resumen diario de noticias

on:
  schedule:
    # cron en UTC. En este repo GitHub ejecuta los crons con 4-5 horas de
    # atraso de forma consistente (programado a las 12:07 UTC salía a las
    # 16:10-16:57). Se programa a las 08:07 UTC (05:07 Chile) para que
    # aterrice entre las 09:00 y las 10:00 de Chile. Si el atraso cambia,
    # ajusta la hora aquí.
    - cron: "7 8 * * *"
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña Actions
    inputs:
      dry_run:
        description: "Solo imprimir el resumen en el log, sin enviar a Telegram"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # En ejecuciones programadas inputs.dry_run es vacío, así que no se agrega el flag.
        run: python news_agent.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
