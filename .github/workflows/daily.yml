name: Resumen diario de noticias

on:
  schedule:
    # cron en UTC. En este repo GitHub ejecuta los crons con 4-5 horas de
    # atraso de forma consistente (programado a las 12:07 UTC salía a las
    # 16:10-16:57), así que se programa ~4 horas antes de la hora deseada
    # para aterrizar entre las 09:00 y las 10:00 de Chile. Dos entradas
    # para compensar el horario chileno: verano (UTC-3, sep-abr) a las
    # 08:07 UTC e invierno (UTC-4, abr-sep) a las 09:07 UTC. Los cambios
    # de hora caen a principios de abril y de septiembre, así que esas
    # semanas puede llegar una hora corrida. Si el atraso cambia, ajusta.
    - cron: "7 8 * 1-3,9-12 *"
    - cron: "7 9 * 4-8 *"
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña Actions
    inputs:
      dry_run:
        description: "Solo imprimir el resumen en el log, sin enviar a Telegram"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # En ejecuciones programadas inputs.dry_run es vacío, así que no se agrega el flag.
        run: python news_agent.py ${{ inputs.dry_run == true && '--dry-run' || '' }}
