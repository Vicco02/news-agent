name: Resumen semanal de videojuegos

on:
  schedule:
    # Lunes. GitHub ejecuta los crons de este repo con 4-5 horas de atraso,
    # así que se programa ~4 horas antes para llegar entre las 09:00 y las
    # 10:00 de Chile: verano (UTC-3, sep-abr) 08:07 UTC, invierno (UTC-4,
    # abr-sep) 09:07 UTC. Mismo criterio que daily.yml.
    - cron: "7 8 * 1-3,9-12 1"
    - cron: "7 9 * 4-8 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo imprimir el resumen en el log, sin enviar a Telegram"
        type: boolean
        default: false
      days:
        description: "Ventana en días (vacío = desde el lunes de la semana pasada)"
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente semanal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          DAYS: ${{ inputs.days }}
        run: |
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ -n "$DAYS" ] && args="$args --days $DAYS"
          python gaming_agent.py $args
